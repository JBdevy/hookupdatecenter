name: CatLive macOS PKG

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do CatLive (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  macos-pkg:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A versão deve ter o formato 1.0.0'; exit 1; }
          for name in APP_CERT_BASE64 APP_CERT_PASSWORD INSTALLER_CERT_BASE64 INSTALLER_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Credencial ausente: $name"
              exit 1
            fi
          done

      - name: Prepare CatStemSeparation runtime
        working-directory: JarasLive
        run: python3 scripts/prepare-catstem.py

      - name: Build universal CatLive app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarasLive/CatLive.xcodeproj \
            -scheme 'CatLive macOS' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/catlive-build" \
            -jobs 2 \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            build
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.hookdeveloper.jaraslive.mac'
          ARCHS_FOUND="$(lipo -archs "$APP/Contents/MacOS/CatLive")"
          [[ " $ARCHS_FOUND " == *" arm64 "* ]]
          [[ " $ARCHS_FOUND " == *" x86_64 "* ]]

      - name: Import Developer ID certificates
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/catlive-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-app.p12"
          printf '%s' "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/catlive-app.p12" -k "$KEYCHAIN" -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/catlive-installer.p12" -k "$KEYCHAIN" -P "$INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/catlive-app.p12" "$RUNNER_TEMP/catlive-installer.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application:'
          security find-identity -v -p basic "$KEYCHAIN" | grep -q 'Developer ID Installer:'
          echo "CATLIVE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign CatLive and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          ENTITLEMENTS='JarasLive/Apple/CatLive-DeveloperID.entitlements'
          APP_ID="$(security find-identity -v -p codesigning "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$APP_ID"
          while IFS= read -r -d '' file_path; do
            if file -b "$file_path" | grep -q 'Mach-O'; then
              codesign --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$file_path"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          codesign --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build signed PKG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          INSTALLER_ID="$(security find-identity -v -p basic "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          test -n "$INSTALLER_ID"
          mkdir -p dist
          productbuild --component "$APP" /Applications --component-compression auto --sign "$INSTALLER_ID" "dist/CatLive-$VERSION-macOS.pkg"
          pkgutil --check-signature "dist/CatLive-$VERSION-macOS.pkg" | grep -q 'Developer ID Installer:'

      - name: Notarize and staple PKG
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/CatLive-$VERSION-macOS.pkg"
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 90m --output-format json > "$RUNNER_TEMP/catlive-notary-result.json"
          cat "$RUNNER_TEMP/catlive-notary-result.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if data.get("status") == "Accepted" else 1)' "$RUNNER_TEMP/catlive-notary-result.json"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          shasum -a 256 "$PKG" > "$PKG.sha256"

      - name: Upload notarized installer
        uses: actions/upload-artifact@v4
        with:
          name: CatLive-${{ inputs.version }}-macOS-PKG
          path: |
            dist/CatLive-*.pkg
            dist/CatLive-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14
