name: CatLive Intel Seek Diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-audio:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check queued seek at 44.1 kHz and 48 kHz
        working-directory: JarasLive
        run: |
          bash scripts/test-audio.sh Tests/Apple/LiveSeekPreparationTests.swift
      - name: Check with longer lead if the first test fails
        if: failure()
        working-directory: JarasLive
        run: CATLIVE_SEEK_PROBE_LEAD=1.65 bash scripts/test-audio.sh Tests/Apple/LiveSeekPreparationTests.swift
