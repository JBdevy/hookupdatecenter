name: CatLive Desktop - installable test packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop package to build
        default: both
        type: choice
        options: [both, macos, windows, intel-audio, integration]
      version:
        description: Public version
        required: true
        default: '2.00'
permissions:
  contents: read
concurrency:
  group: catlive-desktop-test-packages-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  integration:
    if: inputs.platform == 'integration'
    uses: ./.github/workflows/catlive-integration.yml
    secrets: inherit

  windows:
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version and installer compiler
        shell: pwsh
        env:
          CATLIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CATLIVE_RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]{2}$') { throw 'Use uma versão X.XX, como 1.25.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE) { throw 'Falha ao instalar Inno Setup.' }
          }
          if (-not (Test-Path $compiler)) { throw 'Compilador do instalador não encontrado.' }
      - name: Compile and package Windows 10 / 11 x64
        shell: pwsh
        env:
          CATLIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./JarasLive/Windows/build.ps1 -Version $env:CATLIVE_RELEASE_VERSION -BuildDirectory "$env:RUNNER_TEMP/catlive-windows" -Installer -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-Windows
          path: |
            ${{ runner.temp }}/catlive-windows/installer/Catlive-*.exe
            ${{ runner.temp }}/catlive-windows/installer/Catlive-*.exe.sha256
          if-no-files-found: error

  macos-pkg:
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]{2})$ ]] || { echo 'A versão deve ter o formato X.XX (ex.: 1.00)'; exit 1; }
          # Preserve the public X.XX string, including its leading zero.
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          for name in APP_CERT_BASE64 APP_CERT_PASSWORD INSTALLER_CERT_BASE64 INSTALLER_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Credencial ausente: $name"
              exit 1
            fi
          done

      - name: Validate timestamp signing retries
        run: python3 scripts/test-codesign-retry.py

      - name: Prepare CatStemSeparation runtime
        working-directory: JarasLive
        run: |
          python3 scripts/prepare-catstem.py

      - name: Build universal CatLive app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarasLive/CatLive.xcodeproj \
            -scheme 'CatLive macOS' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/catlive-build" \
            -jobs 2 \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            build
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.hookdeveloper.jaraslive.mac'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          ARCHS_FOUND="$(lipo -archs "$APP/Contents/MacOS/CatLive")"
          [[ " $ARCHS_FOUND " == *" arm64 "* ]]
          [[ " $ARCHS_FOUND " == *" x86_64 "* ]]
          python3 JarasLive/scripts/test-macos-deployment.py "$APP" --minimum 12.0

      - name: Import Developer ID certificates
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/catlive-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-app.p12"
          printf '%s' "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # This keychain exists only for this job. Avoid an invisible GUI access
          # prompt when productsign requests the Installer private key.
          import_identity() {
            local certificate="$1" password="$2"
            local output="$RUNNER_TEMP/catlive-identity-import.log"
            if security import "$certificate" -k "$KEYCHAIN" -P "$password" -A -t cert -f pkcs12 > "$output" 2>&1; then
              cat "$output"
            elif grep -Fq 'The specified item already exists in the keychain' "$output"; then
              echo 'Shared certificate already imported; checking identities below.'
            else
              cat "$output"
              return 1
            fi
          }
          import_identity "$RUNNER_TEMP/catlive-app.p12" "$APP_CERT_PASSWORD"
          import_identity "$RUNNER_TEMP/catlive-installer.p12" "$INSTALLER_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS=()
          while IFS= read -r existing; do
            existing="${existing//\"/}"
            [[ -z "$existing" || "$existing" == "$KEYCHAIN" ]] || EXISTING_KEYCHAINS+=("$existing")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/catlive-app.p12" "$RUNNER_TEMP/catlive-installer.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application:'
          security find-identity -v "$KEYCHAIN" | grep -q 'Developer ID Installer:'
          echo "CATLIVE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CATLIVE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign CatLive and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          ENTITLEMENTS='JarasLive/Apple/CatLive-DeveloperID.entitlements'
          APP_ID="$(security find-identity -v -p codesigning "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$APP_ID"
          while IFS= read -r -d '' file_path; do
            if file -b "$file_path" | grep -q 'Mach-O'; then
              python3 scripts/codesign-with-retry.py --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$file_path"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          python3 scripts/codesign-with-retry.py --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build unsigned PKG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          mkdir -p dist
          python3 JarasLive/scripts/build-catlive-pkg.py "$APP" \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" --version "$VERSION"

      - name: Sign installer PKG
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$CATLIVE_KEYCHAIN_PASSWORD" "$CATLIVE_KEYCHAIN"
          INSTALLER_ID="$(security find-identity -v "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          test -n "$INSTALLER_ID"
          python3 JarasLive/scripts/sign-catlive-pkg.py \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" \
            "dist/Catlive-$VERSION.pkg" \
            "$INSTALLER_ID" "$CATLIVE_KEYCHAIN"
          PKG_SIGNATURE="$(pkgutil --check-signature "dist/Catlive-$VERSION.pkg")"
          printf '%s\n' "$PKG_SIGNATURE"
          grep -q 'Developer ID Installer:' <<< "$PKG_SIGNATURE"
          grep -q 'Signed with a trusted timestamp' <<< "$PKG_SIGNATURE"

      - name: Notarize and staple PKG
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/Catlive-$VERSION.pkg"
          python3 JarasLive/scripts/notarize-catlive-pkg.py "$PKG" \
            --result "$RUNNER_TEMP/catlive-notary-result.json"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          (cd dist && shasum -a 256 "Catlive-$VERSION.pkg" > "Catlive-$VERSION.pkg.sha256")

      - name: Preserve notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-notarization
          path: ${{ runner.temp }}/catlive-notary-result.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload notarized installer
        uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-PKG
          path: |
            dist/Catlive-*.pkg
            dist/Catlive-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14


  intel-audio:
    if: inputs.platform == 'intel-audio'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    defaults:
      run:
        working-directory: JarasLive
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify Intel architecture
        run: test "$(uname -m)" = x86_64
      - name: Prepare generated native instrument fixture
        run: |
          python3 scripts/generate-test-sf2.py "$RUNNER_TEMP/catlive-native-test.sf2"
          echo "JARAS_TEST_SF2=$RUNNER_TEMP/catlive-native-test.sf2" >> "$GITHUB_ENV"
      - name: Validate native effect DSP and instruments
        run: |
          bash scripts/test-effects.sh
          bash scripts/test-instruments.sh
          bash scripts/test-instrument-behavior.sh
      - name: Validate failed media without stopping healthy stems
        run: CATLIVE_EXPORT_TEST_SOURCE=Tests/Apple/PlaybackMediaIsolationTests.swift bash scripts/test-offline-export.sh
      - name: Validate item FX rendering and limiter gain order
        run: CATLIVE_EXPORT_TEST_SOURCE=Tests/Apple/ItemPluginRenderTests.swift bash scripts/test-offline-plugin-latency.sh
      - name: Validate VST3 state and metronome publication
        run: |
          bash scripts/test-vst3-state-stream.sh
          bash scripts/test-metronome.sh
          bash scripts/test-midi-sequence.sh
