name: CatLive Desktop - macOS and Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão pública do CatLive (ex.: 1.25)'
        required: true
        default: '2.00'
      publish_release:
        description: 'Publicar os instaladores validados'
        type: boolean
        default: false
      audio_only:
        description: 'Executar somente os testes de áudio do macOS (sem publicar)'
        type: boolean
        default: false
      windows_only:
        description: 'Validar somente o Windows e gerar instalador de teste (sem publicar)'
        type: boolean
        default: false
      audio_tests:
        description: 'Executar testes de renderização, Dynamics e Trigger/Gate (1.30 altera áudio)'
        type: boolean
        default: true
      full_fx_tests:
        description: 'Executar também a bateria completa dos FX em 44,1 e 48 kHz (1.30 altera áudio/FX)'
        type: boolean
        default: true
      audio_tail_from_run:
        description: 'Opcional: validar VST3/metrônomo/MIDI após conferir as etapas Intel já aprovadas desta execução'
        default: ''
      reuse_build_run:
        description: 'Opcional: build concluída com os pacotes e a troca de projetos aprovados'
        default: ''
      reuse_audio_run:
        description: 'Opcional: auditoria aprovada após corrigir somente fixtures de teste'
        default: ''

permissions:
  contents: read

jobs:
  macos-pkg:
    if: ${{ !inputs.audio_tail_from_run && !inputs.reuse_build_run && !inputs.audio_only && !inputs.windows_only }}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]{2})$ ]] || { echo 'A versão deve ter o formato X.XX (ex.: 1.00)'; exit 1; }
          # Preserve the public X.XX string, including its leading zero.
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          for name in APP_CERT_BASE64 APP_CERT_PASSWORD INSTALLER_CERT_BASE64 INSTALLER_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Credencial ausente: $name"
              exit 1
            fi
          done

      - name: Validate timestamp signing retries
        run: python3 scripts/test-codesign-retry.py

      - name: Validate project and transport regressions
        working-directory: JarasLive
        run: |
          python3 scripts/test-notarize-catlive-pkg.py
          python3 scripts/test-build-catlive-pkg.py
          cmake -S . -B "$RUNNER_TEMP/catlive-core-tests"
          cmake --build "$RUNNER_TEMP/catlive-core-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/catlive-core-tests" --output-on-failure
          swift test --jobs 2
          bash scripts/test-playlist-occurrences.sh
          bash scripts/test-bridge.sh
          bash scripts/test-smk37-firmware.sh
          bash scripts/test-video-waveform.sh
          bash scripts/test-timeline-waveform-header.sh
          bash scripts/test-timeline-native-body.sh
          bash scripts/test-macos12-layout.sh
          bash scripts/test-control-mappings.sh
          bash scripts/test-remote-midi-actions.sh
          bash scripts/test-ipad-setlist-blocks.sh
          bash scripts/test-ipad-standalone-viewport.sh
          bash scripts/test-track-height-layout.sh
          bash scripts/test-audio-output-binding.sh
          bash scripts/test-grid-hosting.sh
          bash scripts/test-empty-track-mixer-selection.sh
          bash scripts/test-matrix-patch-canvas.sh
          bash scripts/test-native-timeline-backdrop.sh
          bash scripts/test-timeline-base-projection.sh
          bash scripts/test-plugin-catalog.sh
          bash scripts/test-windows-remote-tuning.sh
          bash scripts/test-windows-stage-timer.sh
          bash scripts/test-windows-track-colour.sh
          bash scripts/test-footer-selection-versions.sh
          bash scripts/test-region-arrangement-core.sh
          bash scripts/test-smk37-feedback-budget.sh
          bash scripts/test-sidebar-wheel-routing.sh
          bash scripts/test-native-event-queue.sh
          bash scripts/test-daw-remote.sh
          bash scripts/test-show-mode.sh
          bash scripts/test-project-tabs.sh
          bash scripts/test-remote-project-opening.sh
          bash scripts/test-app-startup-presentation.sh
          bash scripts/test-app-startup-lifecycle.sh
          bash scripts/test-name-color-editor.sh
          bash scripts/test-catstem-session.sh

      - name: Prepare CatStemSeparation runtime
        working-directory: JarasLive
        run: |
          python3 scripts/prepare-catstem.py

      # Audio suites default ON for the 1.30 item gain and FX corrections. Turn them off
      # again only for releases that do not alter engine, DSP, recording or export.
      # Requesting the full FX matrix also includes the base rendering suites.
      - name: Validate audio rendering and unified song entry
        if: ${{ inputs.audio_tests || inputs.full_fx_tests }}
        working-directory: JarasLive
        run: |
          bash scripts/test-audio.sh Tests/Apple/VinhetasPlaybackTests.swift Tests/Apple/AudioRenderTests.swift Tests/Apple/PlaybackSampleEpochTests.swift Tests/Apple/PlaybackEditingContinuityTests.swift Tests/Apple/AudioMediaPreparationTests.swift Tests/Apple/AutomationAudioTests.swift

      - name: Validate media failure isolation and VST3 realtime state
        if: ${{ inputs.audio_tests || inputs.full_fx_tests }}
        working-directory: JarasLive
        run: |
          CATLIVE_EXPORT_TEST_SOURCE=Tests/Apple/PlaybackMediaIsolationTests.swift bash scripts/test-offline-export.sh
          bash scripts/test-vst3-state-stream.sh
          bash scripts/test-metronome.sh

      - name: Validate native FX playback continuity at 44.1 and 48 kHz
        if: ${{ inputs.full_fx_tests }}
        working-directory: JarasLive
        run: bash scripts/test-audio.sh Tests/Apple/NativeFXPlaybackTests.swift Tests/Apple/TrackEQPlaybackTests.swift Tests/Apple/EQIntelStabilityTests.swift Tests/Apple/DynamicsStabilityTests.swift

      - name: Validate Cat Dynamics
        if: ${{ inputs.audio_tests || inputs.full_fx_tests }}
        working-directory: JarasLive
        run: bash scripts/test-cat-dynamics.sh

      - name: Validate Trigger and Gate rendering
        if: ${{ inputs.audio_tests || inputs.full_fx_tests }}
        working-directory: JarasLive
        run: JARAS_AUDIO_TEST_SOURCE=Tests/Apple/TriggerGateRenderTests.swift bash scripts/test-audio.sh

      - name: Validate timecode transport
        working-directory: JarasLive
        run: bash scripts/test-timecode.sh

      - name: Validate timecode signals
        working-directory: JarasLive
        run: bash scripts/test-timecode-signal.sh

      - name: Build universal CatLive app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarasLive/CatLive.xcodeproj \
            -scheme 'CatLive macOS' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/catlive-build" \
            -jobs 2 \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            build
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.hookdeveloper.jaraslive.mac'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          ARCHS_FOUND="$(lipo -archs "$APP/Contents/MacOS/CatLive")"
          [[ " $ARCHS_FOUND " == *" arm64 "* ]]
          [[ " $ARCHS_FOUND " == *" x86_64 "* ]]
          python3 JarasLive/scripts/test-macos-deployment.py "$APP" --minimum 12.0

      - name: Import Developer ID certificates
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/catlive-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-app.p12"
          printf '%s' "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # This keychain exists only for this job. Avoid an invisible GUI access
          # prompt when productsign requests the Installer private key.
          import_identity() {
            local certificate="$1" password="$2"
            local output="$RUNNER_TEMP/catlive-identity-import.log"
            if security import "$certificate" -k "$KEYCHAIN" -P "$password" -A -t cert -f pkcs12 > "$output" 2>&1; then
              cat "$output"
            elif grep -Fq 'The specified item already exists in the keychain' "$output"; then
              echo 'Shared certificate already imported; checking identities below.'
            else
              cat "$output"
              return 1
            fi
          }
          import_identity "$RUNNER_TEMP/catlive-app.p12" "$APP_CERT_PASSWORD"
          import_identity "$RUNNER_TEMP/catlive-installer.p12" "$INSTALLER_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS=()
          while IFS= read -r existing; do
            existing="${existing//\"/}"
            [[ -z "$existing" || "$existing" == "$KEYCHAIN" ]] || EXISTING_KEYCHAINS+=("$existing")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/catlive-app.p12" "$RUNNER_TEMP/catlive-installer.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application:'
          security find-identity -v "$KEYCHAIN" | grep -q 'Developer ID Installer:'
          echo "CATLIVE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CATLIVE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign CatLive and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          ENTITLEMENTS='JarasLive/Apple/CatLive-DeveloperID.entitlements'
          APP_ID="$(security find-identity -v -p codesigning "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$APP_ID"
          while IFS= read -r -d '' file_path; do
            if file -b "$file_path" | grep -q 'Mach-O'; then
              python3 scripts/codesign-with-retry.py --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$file_path"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          python3 scripts/codesign-with-retry.py --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build unsigned PKG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          mkdir -p dist
          python3 JarasLive/scripts/build-catlive-pkg.py "$APP" \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" --version "$VERSION"

      - name: Sign installer PKG
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$CATLIVE_KEYCHAIN_PASSWORD" "$CATLIVE_KEYCHAIN"
          INSTALLER_ID="$(security find-identity -v "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          test -n "$INSTALLER_ID"
          python3 JarasLive/scripts/sign-catlive-pkg.py \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" \
            "dist/Catlive-$VERSION.pkg" \
            "$INSTALLER_ID" "$CATLIVE_KEYCHAIN"
          PKG_SIGNATURE="$(pkgutil --check-signature "dist/Catlive-$VERSION.pkg")"
          printf '%s\n' "$PKG_SIGNATURE"
          grep -q 'Developer ID Installer:' <<< "$PKG_SIGNATURE"
          grep -q 'Signed with a trusted timestamp' <<< "$PKG_SIGNATURE"

      - name: Notarize and staple PKG
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/Catlive-$VERSION.pkg"
          python3 JarasLive/scripts/notarize-catlive-pkg.py "$PKG" \
            --result "$RUNNER_TEMP/catlive-notary-result.json"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          (cd dist && shasum -a 256 "Catlive-$VERSION.pkg" > "Catlive-$VERSION.pkg.sha256")

      - name: Preserve notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-notarization
          path: ${{ runner.temp }}/catlive-notary-result.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload notarized installer
        uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-PKG
          path: |
            dist/Catlive-*.pkg
            dist/Catlive-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14
