name: CatLive Desktop - macOS and Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão pública do CatLive (ex.: 1.07)'
        required: true
        default: '1.07'
      audio_only:
        description: 'Executar somente os testes de áudio do macOS (sem publicar)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: catlive-desktop-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  audio-validation:
    if: ${{ inputs.audio_only }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate native audio scheduling and rendering
        working-directory: JarasLive
        env:
          JARAS_AUDIO_TEST_REPEATS: '3'
        run: bash scripts/test-audio.sh

  windows:
    if: ${{ !inputs.audio_only }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release version and installer compiler
        shell: pwsh
        env:
          CATLIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:CATLIVE_RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]{2}$') { throw 'Use uma versão X.XX, como 1.07.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE) { throw 'Falha ao instalar Inno Setup.' }
          }
          if (-not (Test-Path $compiler)) { throw 'Compilador do instalador não encontrado.' }
      - name: Build and test Windows 10 / 11 x64
        shell: pwsh
        env:
          CATLIVE_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ./JarasLive/Windows/build.ps1 -Version $env:CATLIVE_RELEASE_VERSION -BuildDirectory "$env:RUNNER_TEMP/catlive-windows" -Installer
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CatLive-Windows-Test-Results
          path: ${{ runner.temp }}/catlive-windows/test-results/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Windows-Binary
          path: |
            ${{ runner.temp }}/catlive-windows/package/CatLive-Windows-x64/CatLive.exe
            ${{ runner.temp }}/catlive-windows/package/CatLive-Windows-x64/CatLiveLame.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Windows-Fixtures
          path: |
            ${{ runner.temp }}/catlive-windows/test-results/fixture.jl
            ${{ runner.temp }}/catlive-windows/test-results/fixture.json
            ${{ runner.temp }}/catlive-windows/test-results/remote-state.json
            ${{ runner.temp }}/catlive-windows/test-results/external-crypto.jl
            ${{ runner.temp }}/catlive-windows/test-results/fx-portability.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Windows-Import-Fixtures
          path: ${{ runner.temp }}/catlive-windows/migration-tests/parity-fixtures/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-Windows
          path: |
            ${{ runner.temp }}/catlive-windows/installer/Catlive-*.exe
            ${{ runner.temp }}/catlive-windows/installer/Catlive-*.exe.sha256
          if-no-files-found: error

  macos-pkg:
    if: ${{ !inputs.audio_only }}
    runs-on: macos-26
    timeout-minutes: 180
    env:
      VERSION: ${{ inputs.version }}
      APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]{2})$ ]] || { echo 'A versão deve ter o formato X.XX (ex.: 1.00)'; exit 1; }
          # Preserve the public X.XX string, including its leading zero.
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          for name in APP_CERT_BASE64 APP_CERT_PASSWORD INSTALLER_CERT_BASE64 INSTALLER_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Credencial ausente: $name"
              exit 1
            fi
          done

      - name: Validate project and transport regressions
        working-directory: JarasLive
        run: |
          swift test --jobs 2
          bash scripts/test-bridge.sh
          bash scripts/test-control-mappings.sh
          bash scripts/test-plugin-catalog.sh
          bash scripts/test-daw-remote.sh
          bash scripts/test-show-mode.sh
          bash scripts/test-project-tabs.sh

      - name: Prepare CatStemSeparation runtime
        working-directory: JarasLive
        run: |
          python3 scripts/prepare-catstem.py
          python3 scripts/prepare-catstem-realtime.py

      - name: Validate native audio playback, unified song entry and timecode
        working-directory: JarasLive
        run: |
          bash scripts/test-audio.sh
          bash scripts/test-timecode.sh
          bash scripts/test-timecode-signal.sh

      - name: Build universal CatLive app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project JarasLive/CatLive.xcodeproj \
            -scheme 'CatLive macOS' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/catlive-build" \
            -jobs 2 \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$((1000 + GITHUB_RUN_NUMBER))" \
            build
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'com.hookdeveloper.jaraslive.mac'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          ARCHS_FOUND="$(lipo -archs "$APP/Contents/MacOS/CatLive")"
          [[ " $ARCHS_FOUND " == *" arm64 "* ]]
          [[ " $ARCHS_FOUND " == *" x86_64 "* ]]
          python3 JarasLive/scripts/test-macos-deployment.py "$APP" --minimum 12.0 \
            --optional-helper 'Contents/Resources/StemSeparationRuntime/realtime-arm64=14.0'

      - name: Import Developer ID certificates
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/catlive-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APP_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-app.p12"
          printf '%s' "$INSTALLER_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/catlive-installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # This keychain exists only for this job. Avoid an invisible GUI access
          # prompt when productsign requests the Installer private key.
          import_identity() {
            local certificate="$1" password="$2"
            local output="$RUNNER_TEMP/catlive-identity-import.log"
            if security import "$certificate" -k "$KEYCHAIN" -P "$password" -A -t cert -f pkcs12 > "$output" 2>&1; then
              cat "$output"
            elif grep -Fq 'The specified item already exists in the keychain' "$output"; then
              echo 'Shared certificate already imported; checking identities below.'
            else
              cat "$output"
              return 1
            fi
          }
          import_identity "$RUNNER_TEMP/catlive-app.p12" "$APP_CERT_PASSWORD"
          import_identity "$RUNNER_TEMP/catlive-installer.p12" "$INSTALLER_CERT_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          EXISTING_KEYCHAINS=()
          while IFS= read -r existing; do
            existing="${existing//\"/}"
            [[ -z "$existing" || "$existing" == "$KEYCHAIN" ]] || EXISTING_KEYCHAINS+=("$existing")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"
          rm -f "$RUNNER_TEMP/catlive-app.p12" "$RUNNER_TEMP/catlive-installer.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Developer ID Application:'
          security find-identity -v "$KEYCHAIN" | grep -q 'Developer ID Installer:'
          echo "CATLIVE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CATLIVE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Sign CatLive and embedded runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          ENTITLEMENTS='JarasLive/Apple/CatLive-DeveloperID.entitlements'
          APP_ID="$(security find-identity -v -p codesigning "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$APP_ID"
          while IFS= read -r -d '' file_path; do
            if file -b "$file_path" | grep -q 'Mach-O'; then
              codesign --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$file_path"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          codesign --force --sign "$APP_ID" --options runtime --timestamp --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build unsigned PKG
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/catlive-build/Build/Products/Release/CatLive.app"
          mkdir -p dist
          python3 JarasLive/scripts/build-catlive-pkg.py "$APP" \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" --version "$VERSION"

      - name: Sign installer PKG
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$CATLIVE_KEYCHAIN_PASSWORD" "$CATLIVE_KEYCHAIN"
          INSTALLER_ID="$(security find-identity -v "$CATLIVE_KEYCHAIN" | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)"
          test -n "$INSTALLER_ID"
          python3 JarasLive/scripts/sign-catlive-pkg.py \
            "$RUNNER_TEMP/CatLive-$VERSION-unsigned.pkg" \
            "dist/Catlive-$VERSION.pkg" \
            "$INSTALLER_ID" "$CATLIVE_KEYCHAIN"
          PKG_SIGNATURE="$(pkgutil --check-signature "dist/Catlive-$VERSION.pkg")"
          printf '%s\n' "$PKG_SIGNATURE"
          grep -q 'Developer ID Installer:' <<< "$PKG_SIGNATURE"
          grep -q 'Signed with a trusted timestamp' <<< "$PKG_SIGNATURE"

      - name: Notarize and staple PKG
        shell: bash
        run: |
          set -euo pipefail
          PKG="dist/Catlive-$VERSION.pkg"
          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 90m --output-format json > "$RUNNER_TEMP/catlive-notary-result.json"
          cat "$RUNNER_TEMP/catlive-notary-result.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if data.get("status") == "Accepted" else 1)' "$RUNNER_TEMP/catlive-notary-result.json"
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          (cd dist && shasum -a 256 "Catlive-$VERSION.pkg" > "Catlive-$VERSION.pkg.sha256")

      - name: Upload notarized installer
        uses: actions/upload-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-PKG
          path: |
            dist/Catlive-*.pkg
            dist/Catlive-*.pkg.sha256
          if-no-files-found: error
          retention-days: 14

  # Platform builds start together. The document exchange still gates publishing,
  # but waiting for Windows fixtures must not delay the Mac app/notarization.
  macos-compatibility:
    needs: windows
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Windows-Fixtures
          path: ${{ runner.temp }}/catlive-windows-fixtures
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Windows-Import-Fixtures
          path: ${{ runner.temp }}/catlive-windows-import-fixtures
      - name: Validate Windows projects and Remote with the Mac implementation
        working-directory: JarasLive
        env:
          CATLIVE_COMPATIBILITY_INPUT: ${{ runner.temp }}/catlive-windows-fixtures
          CATLIVE_COMPATIBILITY_OUTPUT: ${{ runner.temp }}/catlive-mac-fixtures
          CATLIVE_WINDOWS_FX_FIXTURE: ${{ runner.temp }}/catlive-windows-fixtures/fx-portability.json
          CATLIVE_WINDOWS_IMPORT_FIXTURES: ${{ runner.temp }}/catlive-windows-import-fixtures
        run: |
          swift test --jobs 2 --filter ProjectEncryptionTests/testCrossPlatformReleaseFixtures
          swift test --jobs 2 --filter WindowsFXPortabilityTests
          swift test --jobs 2 --filter WindowsDAWImportParityTests
          python3 scripts/verify-daw-import-parity.py "$CATLIVE_WINDOWS_IMPORT_FIXTURES"
          bash scripts/test-daw-remote.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Mac-Fixtures
          path: ${{ runner.temp }}/catlive-mac-fixtures/
          if-no-files-found: error

  compatibility:
    needs: [windows, macos-compatibility]
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Windows-Binary
          path: windows-binary
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Windows-Fixtures
          path: windows-fixtures
      - uses: actions/download-artifact@v4
        with:
          name: CatLive-Mac-Fixtures
          path: mac-fixtures
      - name: Validate actual Mac and Windows document exchange
        run: node JarasLive/Windows/scripts/verify-mac-roundtrip.cjs windows-binary/CatLive.exe windows-fixtures mac-fixtures compatibility-results
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Compatibility-Results
          path: compatibility-results/
          if-no-files-found: error

  release:
    needs: [windows, macos-pkg, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Validate release publication credentials
        env:
          CATLIVE_RELEASE_TOKEN: ${{ secrets.CATLIVE_RELEASE_TOKEN }}
        run: |
          if [ -z "$CATLIVE_RELEASE_TOKEN" ]; then
            echo 'Configure CATLIVE_RELEASE_TOKEN with repository contents and workflow permissions.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-PKG
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Catlive-${{ inputs.version }}-Windows
          path: dist
      - name: Verify release installers and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd dist
          test -s "Catlive-$VERSION.pkg"
          test -s "Catlive-$VERSION.exe"
          sha256sum --check "Catlive-$VERSION.pkg.sha256"
          sha256sum --check "Catlive-$VERSION.exe.sha256"
      - name: Publish both desktop installers together
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.CATLIVE_RELEASE_TOKEN }}
          tag_name: catlive-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: CatLive ${{ inputs.version }} - macOS and Windows
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            CatLive ${{ inputs.version }} para macOS universal e Windows 10/11 x64.
            Projeto .jl compartilhado entre as plataformas, com preservação do mapa grandMA2 ao salvar no Mac.
            Publicação condicionada aos testes nativos e à troca de documentos Windows → Mac → Windows e Mac → Windows.
            Instalador macOS assinado e notarizado. Instalador Windows sem assinatura Authenticode nesta configuração.
          files: |
            dist/Catlive-*.pkg
            dist/Catlive-*.exe
      - name: Finalize release installers and source tag
        uses: actions/github-script@v7
        env:
          CATLIVE_RELEASE_VERSION: ${{ inputs.version }}
        with:
          github-token: ${{ secrets.CATLIVE_RELEASE_TOKEN }}
          script: |
            const version = process.env.CATLIVE_RELEASE_VERSION;
            if (!/^[0-9]+\.[0-9]{2}$/.test(version) || !/^[0-9a-f]{40}$/.test(context.sha)) {
              throw new Error('Invalid release version or source commit');
            }
            const { owner, repo } = context.repo;
            const tag = `catlive-v${version}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const installers = new Set([`Catlive-${version}.pkg`, `Catlive-${version}.exe`]);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id });
            for (const name of installers) {
              const matches = assets.filter(asset => asset.name === name);
              if (matches.length !== 1 || matches[0].state !== 'uploaded' || matches[0].size <= 0) {
                throw new Error(`Release installer missing or incomplete: ${name}`);
              }
            }
            for (const asset of assets) {
              if (!installers.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
                core.info(`Removed obsolete release attachment: ${asset.name}`);
              }
            }
            // Rebuilding the same public version replaces its installers. Point
            // the matching tag at their tested source only after both uploads.
            const { data: sourceTag } = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (sourceTag.object.sha !== context.sha) {
              await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true });
            }
            if (release.target_commitish !== context.sha) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, target_commitish: context.sha });
            }
            core.info(`Release ${tag} contains only its two installers, built from ${context.sha}`);
