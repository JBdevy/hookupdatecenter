name: Build Hook Update Center

on:
  workflow_dispatch:
  push:
    tags:
      - 'hook-update-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build macOS unsigned universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  build-macos-legacy:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Use Electron 26 for macOS 10 legacy
        run: npm install electron@26.6.10 --no-save --legacy-peer-deps --no-audit --no-fund

      - name: Build macOS Legacy unsigned x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac:legacy

      - name: Upload macOS Legacy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-legacy-dmg
          path: |
            dist-legacy/*.dmg
            dist-legacy/*.dmg.blockmap
            dist-legacy/*.zip
            dist-legacy/*.zip.blockmap
            dist-legacy/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-macos-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/Hook-Center-*-Windows.exe
            artifacts/**/Hook-Center-*-Windows.exe.blockmap
            artifacts/**/latest.yml
            artifacts/**/Hook-Center-*-macOS.dmg
            artifacts/**/Hook-Center-*-macOS.dmg.blockmap
            artifacts/**/Hook-Center-*-macOS.zip
            artifacts/**/Hook-Center-*-macOS.zip.blockmap
            artifacts/**/latest-mac.yml
            artifacts/**/Hook-Center-Legacy-*-macOS10.dmg
            artifacts/**/Hook-Center-Legacy-*-macOS10.dmg.blockmap
            artifacts/**/Hook-Center-Legacy-*-macOS10.zip
            artifacts/**/Hook-Center-Legacy-*-macOS10.zip.blockmap
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
