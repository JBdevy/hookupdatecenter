name: Build Hook Update Center

on:
  workflow_dispatch:
  push:
    tags:
      - 'hook-update-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Teleprompt Settings companion
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --prefix teleprompt-settings --legacy-peer-deps
          npm run build:win --prefix teleprompt-settings
          $source = Get-ChildItem teleprompt-settings/dist -Directory -Filter win-unpacked | Select-Object -First 1
          if (-not $source) { throw "Aplicativo auxiliar do Teleprompt nao encontrado." }
          $destination = 'build/vshook-companion'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -LiteralPath $destination -Force | Remove-Item -Recurse -Force
          Copy-Item "$($source.FullName)/*" $destination -Recurse -Force
          $required = @(
            'VS Hook Teleprompt Settings.exe',
            'resources/app.asar',
            'resources.pak',
            'icudtl.dat',
            'ffmpeg.dll',
            'libEGL.dll',
            'libGLESv2.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $destination $_) -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Aplicativo auxiliar do Teleprompt incompleto: $($missing -join ', ')"
          }
          node -e "const asar=require('@electron/asar'); const html=asar.extractFile(process.argv[1],'settings.html').toString(); for (const key of ['previewSongDurationEnabled','previewBlockDurationEnabled','previewUnderlineEnabled']) { if (!html.includes(key)) throw new Error('Teleprompt Settings sem a opção '+key); }" (Join-Path $destination 'resources/app.asar')

      - name: Build Windows
        run: npm run build:win

      - name: Validate Windows installer payload
        shell: pwsh
        run: |
          $payload = 'dist/win-unpacked/resources/vshook-companion'
          $required = @(
            'VS Hook Teleprompt Settings.exe',
            'resources/app.asar',
            'resources.pak',
            'icudtl.dat',
            'ffmpeg.dll',
            'libEGL.dll',
            'libGLESv2.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $payload $_) -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Pacote final da Hook Center sem o Teleprompt completo: $($missing -join ', ')"
          }
          $themeSource = 'themes'
          $themePayload = 'dist/win-unpacked/resources/vshook-themes'
          $themes = @(Get-ChildItem -LiteralPath $themeSource -File | Where-Object {
            $_.Name -match '\.(ReaperTheme|ReaperThemeZip)$'
          })
          if ($themes.Count -eq 0) {
            throw 'Nenhum tema foi encontrado na pasta themes.'
          }
          $missingThemes = @($themes | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $themePayload $_.Name) -PathType Leaf)
          } | ForEach-Object Name)
          if ($missingThemes.Count -gt 0) {
            throw "Pacote final da Hook Center sem os temas: $($missingThemes -join ', ')"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Secret MACOS_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Secret MACOS_CERT_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_ID" || (echo "Secret APPLE_ID não configurado" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Secret APPLE_APP_SPECIFIC_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Secret APPLE_TEAM_ID não configurado" && exit 1)

      - name: Build signed Teleprompt Settings companion
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: |
          npm ci --prefix teleprompt-settings --legacy-peer-deps
          npm run build:mac --prefix teleprompt-settings
          APP="$(find teleprompt-settings/dist -type d -name 'VS Hook Teleprompt Settings.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          rm -rf build/vshook-companion
          mkdir -p build/vshook-companion
          ditto "$APP" "build/vshook-companion/VS Hook Teleprompt Settings.app"
          codesign --verify --deep --strict "build/vshook-companion/VS Hook Teleprompt Settings.app"
          node -e "const asar=require('@electron/asar'); const html=asar.extractFile(process.argv[1],'settings.html').toString(); for (const key of ['previewSongDurationEnabled','previewBlockDurationEnabled','previewUnderlineEnabled']) { if (!html.includes(key)) throw new Error('Teleprompt Settings sem a opção '+key); }" "$APP/Contents/Resources/app.asar"

      - name: Build macOS signed universal
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Validate macOS theme payload
        run: |
          THEME_DIR="$(find dist -path '*/Hook Center.app/Contents/Resources/vshook-themes' -type d -print -quit)"
          test -n "$THEME_DIR" || (echo "Pacote final da Hook Center sem a pasta de temas." && exit 1)
          THEME_COUNT=0
          for THEME in themes/*.ReaperTheme themes/*.ReaperThemeZip; do
            test -f "$THEME" || continue
            THEME_COUNT=$((THEME_COUNT + 1))
            THEME_NAME="$(basename "$THEME")"
            test -f "$THEME_DIR/$THEME_NAME" || (echo "Pacote final da Hook Center sem o tema $THEME_NAME." && exit 1)
          done
          test "$THEME_COUNT" -gt 0 || (echo "Nenhum tema foi encontrado na pasta themes." && exit 1)

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/Hook-Center-*-Windows.exe
            artifacts/**/Hook-Center-*-Windows.exe.blockmap
            artifacts/**/latest.yml
            artifacts/**/Hook-Center-*-macOS.dmg
            artifacts/**/Hook-Center-*-macOS.dmg.blockmap
            artifacts/**/Hook-Center-*-macOS.zip
            artifacts/**/Hook-Center-*-macOS.zip.blockmap
            artifacts/hook-update-center-macos-dmg/latest-mac.yml
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
