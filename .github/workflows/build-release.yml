name: Build Hook Update Center

on:
  workflow_dispatch:
  push:
    tags:
      - 'hook-update-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Teleprompt Settings companion
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --prefix teleprompt-settings --legacy-peer-deps
          npm run build:win --prefix teleprompt-settings
          $source = Get-ChildItem teleprompt-settings/dist -Directory -Filter win-unpacked | Select-Object -First 1
          if (-not $source) { throw "Aplicativo auxiliar do Teleprompt nao encontrado." }
          $destination = 'build/vshook-companion'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -LiteralPath $destination -Force | Remove-Item -Recurse -Force
          Copy-Item "$($source.FullName)/*" $destination -Recurse -Force
          $required = @(
            'VS Hook Teleprompt Settings.exe',
            'resources/app.asar',
            'resources.pak',
            'icudtl.dat',
            'ffmpeg.dll',
            'libEGL.dll',
            'libGLESv2.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $destination $_) -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Aplicativo auxiliar do Teleprompt incompleto: $($missing -join ', ')"
          }
          node -e "const asar=require('@electron/asar'); const html=asar.extractFile(process.argv[1],'settings.html').toString(); for (const key of ['previewSongDurationEnabled','previewBlockDurationEnabled','previewUnderlineEnabled','clearModeButton']) { if (!html.includes(key)) throw new Error('Teleprompt Settings sem a opção '+key); }" (Join-Path $destination 'resources/app.asar')

      - name: Build Windows
        run: npm run build:win

      - name: Validate Hook Center protocol payload
        shell: pwsh
        run: |
          $asarPath = 'dist/win-unpacked/resources/app.asar'
          if (-not (Test-Path -LiteralPath $asarPath -PathType Leaf)) {
            throw 'Pacote final da Hook Center sem resources/app.asar.'
          }
          node -e "const asar=require('@electron/asar'); const lan=asar.extractFile(process.argv[1],'src/timecode-lan.js').toString(); const main=asar.extractFile(process.argv[1],'src/main.js').toString(); const preload=asar.extractFile(process.argv[1],'src/preload.js').toString(); if (!lan.includes('/capabilities') || !lan.includes('PROJECT_SYNC_PROTOCOL_VERSION') || !lan.includes('projectSyncProtocolVersion: PROJECT_SYNC_PROTOCOL_VERSION')) throw new Error('Hook Center sem Project Sync v2'); if (!main.includes('updateInstallerQuitWatchdog') || !main.includes('app.exit(0)')) throw new Error('Hook Center sem encerramento reforcado do atualizador'); if (preload.includes('const os = require') || !preload.includes('process.getSystemVersion') || !preload.includes('hookUpdateCenter')) throw new Error('Hook Center com preload incompativel com o sandbox');" $asarPath

      - name: Validate Windows installer payload
        shell: pwsh
        run: |
          $payload = 'dist/win-unpacked/resources/vshook-companion'
          $required = @(
            'VS Hook Teleprompt Settings.exe',
            'resources/app.asar',
            'resources.pak',
            'icudtl.dat',
            'ffmpeg.dll',
            'libEGL.dll',
            'libGLESv2.dll'
          )
          $missing = @($required | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $payload $_) -PathType Leaf)
          })
          if ($missing.Count -gt 0) {
            throw "Pacote final da Hook Center sem o Teleprompt completo: $($missing -join ', ')"
          }
          $themeSource = 'themes'
          $themePayload = 'dist/win-unpacked/resources/vshook-themes'
          $themes = @(Get-ChildItem -LiteralPath $themeSource -File | Where-Object {
            $_.Name -match '\.(ReaperTheme|ReaperThemeZip)$'
          })
          if ($themes.Count -eq 0) {
            throw 'Nenhum tema foi encontrado na pasta themes.'
          }
          $missingThemes = @($themes | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $themePayload $_.Name) -PathType Leaf)
          } | ForEach-Object Name)
          if ($missingThemes.Count -gt 0) {
            throw "Pacote final da Hook Center sem os temas: $($missingThemes -join ', ')"
          }
          $midiInstaller = 'dist/win-unpacked/resources/windows-midi-services/Windows-MIDI-Services-Runtime-and-Tools-x64.exe'
          if (-not (Test-Path -LiteralPath $midiInstaller -PathType Leaf)) {
            throw 'Pacote final da Hook Center sem o instalador do Windows MIDI Services.'
          }
          $midiExpectedSize = 219603123
          $midiExpectedHash = '5D241B52669A69795B7503F53EB082F83A1860E5EBC50849427B79F15C1A2546'
          if ((Get-Item -LiteralPath $midiInstaller).Length -ne $midiExpectedSize) {
            throw 'Instalador do Windows MIDI Services com tamanho incorreto.'
          }
          if ((Get-FileHash -LiteralPath $midiInstaller -Algorithm SHA256).Hash -ne $midiExpectedHash) {
            throw 'Instalador do Windows MIDI Services com SHA-256 incorreto.'
          }
          $ffmpegRuntime = 'dist/win-unpacked/resources/ffmpeg-runtime/ffmpeg-8.1.2-win64-lgpl-shared.zip'
          if (-not (Test-Path -LiteralPath $ffmpegRuntime -PathType Leaf)) {
            throw 'Pacote final da Hook Center sem o runtime FFmpeg do Windows.'
          }
          if ((Get-Item -LiteralPath $ffmpegRuntime).Length -lt 50MB) {
            throw 'Runtime FFmpeg do Windows está incompleto.'
          }
          $ffmpegHeader = [System.IO.File]::ReadAllBytes($ffmpegRuntime)[0..1]
          if ($ffmpegHeader[0] -ne 0x50 -or $ffmpegHeader[1] -ne 0x4b) {
            throw 'Runtime FFmpeg do Windows não é um ZIP válido.'
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Secret MACOS_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Secret MACOS_CERT_PASSWORD não configurado" && exit 1)
          test -n "$MACOS_INSTALLER_CERT_P12_BASE64" || (echo "Secret MACOS_INSTALLER_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$MACOS_INSTALLER_CERT_PASSWORD" || (echo "Secret MACOS_INSTALLER_CERT_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_ID" || (echo "Secret APPLE_ID não configurado" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Secret APPLE_APP_SPECIFIC_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Secret APPLE_TEAM_ID não configurado" && exit 1)

      - name: Import Developer ID Application certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/vshook-developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/vshook-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.MACOS_CERT_P12_BASE64, 'base64'))" "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          rm -f "$CERTIFICATE_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Developer ID Application'

      - name: Build signed Teleprompt Settings companion
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: |
          npm ci --prefix teleprompt-settings --legacy-peer-deps
          npm run build:mac --prefix teleprompt-settings
          APP="$(find teleprompt-settings/dist -type d -name 'VS Hook Teleprompt Settings.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          rm -rf build/vshook-companion
          mkdir -p build/vshook-companion
          ditto "$APP" "build/vshook-companion/VS Hook Teleprompt Settings.app"
          codesign --verify --deep --strict "build/vshook-companion/VS Hook Teleprompt Settings.app"
          node -e "const asar=require('@electron/asar'); const html=asar.extractFile(process.argv[1],'settings.html').toString(); for (const key of ['previewSongDurationEnabled','previewBlockDurationEnabled','previewUnderlineEnabled','clearModeButton']) { if (!html.includes(key)) throw new Error('Teleprompt Settings sem a opção '+key); }" "$APP/Contents/Resources/app.asar"

      - name: Build macOS signed universal
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Validate Hook Center protocol payload
        run: |
          APP="$(find dist -type d -name 'Hook Center.app' -print -quit)"
          test -n "$APP" || (echo "Hook Center.app nao encontrado." && exit 1)
          ASAR="$APP/Contents/Resources/app.asar"
          test -f "$ASAR" || (echo "Pacote final da Hook Center sem resources/app.asar." && exit 1)
          node -e "const asar=require('@electron/asar'); const lan=asar.extractFile(process.argv[1],'src/timecode-lan.js').toString(); const main=asar.extractFile(process.argv[1],'src/main.js').toString(); const renderer=asar.extractFile(process.argv[1],'src/renderer.js').toString(); const preload=asar.extractFile(process.argv[1],'src/preload.js').toString(); if (!lan.includes('/capabilities') || !lan.includes('PROJECT_SYNC_PROTOCOL_VERSION') || !lan.includes('projectSyncProtocolVersion: PROJECT_SYNC_PROTOCOL_VERSION')) throw new Error('Hook Center sem Project Sync v2'); if (!main.includes('updateInstallerQuitWatchdog') || !main.includes('app.exit(0)')) throw new Error('Hook Center sem encerramento reforcado do atualizador'); if (preload.includes('const os = require') || !preload.includes('process.getSystemVersion') || !preload.includes('hookUpdateCenter')) throw new Error('Hook Center com preload incompativel com o sandbox'); if (!main.includes('IAC Driver') || !main.includes('Audio MIDI Setup.app') || !renderer.includes('CoreMIDI — Driver IAC')) throw new Error('Hook MIDI do macOS sem integracao nativa com CoreMIDI/IAC');" "$ASAR"
          test ! -e "$APP/Contents/Resources/windows-midi-services" || (echo "Pacote macOS inclui indevidamente o instalador Windows MIDI Services." && exit 1)

      - name: Validate macOS theme payload
        run: |
          THEME_DIR="$(find dist -path '*/Hook Center.app/Contents/Resources/vshook-themes' -type d -print -quit)"
          test -n "$THEME_DIR" || (echo "Pacote final da Hook Center sem a pasta de temas." && exit 1)
          THEME_COUNT=0
          for THEME in themes/*.ReaperTheme themes/*.ReaperThemeZip; do
            test -f "$THEME" || continue
            THEME_COUNT=$((THEME_COUNT + 1))
            THEME_NAME="$(basename "$THEME")"
            test -f "$THEME_DIR/$THEME_NAME" || (echo "Pacote final da Hook Center sem o tema $THEME_NAME." && exit 1)
          done
          test "$THEME_COUNT" -gt 0 || (echo "Nenhum tema foi encontrado na pasta themes." && exit 1)

      - name: Validate macOS PKG installer
        run: |
          PKG="$(find dist -maxdepth 1 -type f -name 'Hook-Center-*-macOS.pkg' -print -quit)"
          test -n "$PKG" || (echo "PKG final da Hook Center não encontrado." && exit 1)
          pkgutil --check-signature "$PKG" | grep -q 'Developer ID Installer' || \
            (echo "PKG sem assinatura Developer ID Installer." && exit 1)
          EXPANDED="$RUNNER_TEMP/hook-center-pkg-expanded"
          rm -rf "$EXPANDED"
          pkgutil --expand-full "$PKG" "$EXPANDED"
          POSTINSTALL="$(find "$EXPANDED" -type f -name postinstall -print -quit)"
          test -n "$POSTINSTALL" || (echo "PKG sem script postinstall." && exit 1)
          grep -q 'VSHookTelepromptSettings' "$POSTINSTALL" || (echo "postinstall sem Teleprompt Settings." && exit 1)

      - name: Notarize macOS PKG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x build/notarize-artifacts.sh
          build/notarize-artifacts.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-pkg
          path: |
            dist/*.pkg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove auxiliary assets from an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t KEEP_ASSETS < <(
            find artifacts -type f \
              \( -name 'Hook-Center-*-Windows.exe' -o -name 'Hook-Center-*-macOS.pkg' \) \
              -printf '%f\n' | sort -u
          )
          if [ "${#KEEP_ASSETS[@]}" -ne 2 ]; then
            echo "Esperava exatamente um instalador Windows e um PKG macOS."
            printf 'Encontrado: %s\n' "${KEEP_ASSETS[@]}"
            exit 1
          fi
          RELEASES_PATH="repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          if ! RELEASES_JSON="$(gh api --paginate "${RELEASES_PATH}" 2>/dev/null)"; then
            echo "Ainda nao existe Release para ${GITHUB_REF_NAME}; nada para limpar."
            exit 0
          fi
          RELEASE_JSON="$(jq -s --arg tag "${GITHUB_REF_NAME}" '
            add
            | map(select(.tag_name == $tag))
            | ((map(select(.draft == false)) | first) // (sort_by(.id) | first) // empty)
          ' <<<"${RELEASES_JSON}")"
          if [ -z "${RELEASE_JSON}" ]; then
            echo "Ainda nao existe Release para ${GITHUB_REF_NAME}; nada para limpar."
            exit 0
          fi

          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [ -n "${ASSET_ID}" ] || continue
            KEEP=0
            for EXPECTED in "${KEEP_ASSETS[@]}"; do
              if [ "${ASSET_NAME}" = "${EXPECTED}" ]; then
                KEEP=1
                break
              fi
            done
            if [ "${KEEP}" -eq 0 ]; then
              echo "Removendo asset auxiliar do Release: ${ASSET_NAME}"
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
            fi
          done < <(jq -r '.assets[]? | [.id, .name] | @tsv' <<<"${RELEASE_JSON}")

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/Hook-Center-*-Windows.exe
            artifacts/**/Hook-Center-*-macOS.pkg
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize release after a transient GitHub API failure
        if: steps.publish_release.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t EXPECTED_ASSETS < <(
            find artifacts -type f \
              \( -name 'Hook-Center-*-Windows.exe' -o -name 'Hook-Center-*-macOS.pkg' \) \
              -printf '%f\n' | sort -u
          )
          if [ "${#EXPECTED_ASSETS[@]}" -ne 2 ]; then
            echo "Esperava exatamente um instalador Windows e um PKG macOS."
            printf 'Encontrado: %s\n' "${EXPECTED_ASSETS[@]}"
            exit 1
          fi

          RELEASES_PATH="repos/${GITHUB_REPOSITORY}/releases?per_page=100"
          API_ERROR_FILE="$(mktemp)"
          trap 'rm -f "${API_ERROR_FILE}"' EXIT
          for ATTEMPT in $(seq 1 12); do
            echo "Tentativa ${ATTEMPT}/12 de validar e finalizar ${GITHUB_REF_NAME}..."
            : >"${API_ERROR_FILE}"
            if RELEASES_JSON="$(gh api --paginate "${RELEASES_PATH}" 2>"${API_ERROR_FILE}")"; then
              RELEASE_JSON="$(jq -s --arg tag "${GITHUB_REF_NAME}" '
                add
                | map(select(.tag_name == $tag))
                | ((map(select(.draft == false)) | first) // (sort_by(.id) | first) // empty)
              ' <<<"${RELEASES_JSON}")"
              if [ -z "${RELEASE_JSON}" ]; then
                echo "O Release draft da tag ainda nao apareceu na API."
                sleep $((ATTEMPT * 5))
                continue
              fi
              MISSING=0
              for ASSET in "${EXPECTED_ASSETS[@]}"; do
                if ! jq -e --arg name "${ASSET}" '.assets[]? | select(.name == $name)' \
                    >/dev/null <<<"${RELEASE_JSON}"; then
                  echo "Ainda falta no GitHub: ${ASSET}"
                  MISSING=1
                fi
              done

              if [ "${MISSING}" -eq 0 ]; then
                RELEASE_ID="$(jq -r '.id' <<<"${RELEASE_JSON}")"
                IS_DRAFT="$(jq -r '.draft' <<<"${RELEASE_JSON}")"
                if [ "${IS_DRAFT}" = "true" ]; then
                  if ! gh api --method PATCH \
                      "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                      -F draft=false >/dev/null; then
                    echo "A API recusou a publicacao nesta tentativa."
                    sleep $((ATTEMPT * 5))
                    continue
                  fi
                fi

                if FINAL_JSON="$(gh api \
                    "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" 2>/dev/null)" && \
                    [ "$(jq -r '.draft' <<<"${FINAL_JSON}")" = "false" ]; then
                  echo "Release ${GITHUB_REF_NAME} publicado com todos os artefatos."
                  exit 0
                fi
              fi
            else
              sed 's/^/GitHub API: /' "${API_ERROR_FILE}"
            fi

            sleep $((ATTEMPT * 5))
          done

          echo "O GitHub continuou indisponivel ou o Release ficou incompleto."
          exit 1
