name: Build Hook Update Center

on:
  workflow_dispatch:
  push:
    tags:
      - 'hook-update-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          test -n "$CSC_LINK" || (echo "MACOS_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "MACOS_CERT_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_ID" || (echo "APPLE_ID não configurado" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "APPLE_APP_SPECIFIC_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "APPLE_TEAM_ID não configurado" && exit 1)

      - name: Build signed macOS universal
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          # Não exportar APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID nesta etapa.
          # O electron-builder 24.13.3 tenta notarização automática interna quando vê essas variáveis
          # e pode quebrar antes dos nossos scripts. Usamos nomes próprios para o afterSign.
          HOOK_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          HOOK_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOOK_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Notarize final DMG and PKG
        env:
          HOOK_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          HOOK_NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOOK_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: bash ./build/notarize-artifacts.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-universal
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/*.pkg
            dist/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/Hook-Center-*-Windows.exe
            artifacts/**/Hook-Center-*-Windows.exe.blockmap
            artifacts/**/latest.yml
            artifacts/**/Hook-Center-*-macOS.dmg
            artifacts/**/Hook-Center-*-macOS.dmg.blockmap
            artifacts/**/Hook-Center-*-macOS.zip
            artifacts/**/Hook-Center-*-macOS.zip.blockmap
            artifacts/**/Hook-Center-*-macOS.pkg
            artifacts/**/latest-mac.yml
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
