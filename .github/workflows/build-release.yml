name: Build Hook Update Center

on:
  workflow_dispatch:
  push:
    tags:
      - 'hook-update-*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Secret MACOS_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Secret MACOS_CERT_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_ID" || (echo "Secret APPLE_ID não configurado" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Secret APPLE_APP_SPECIFIC_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Secret APPLE_TEAM_ID não configurado" && exit 1)

      - name: Build macOS signed universal
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-dmg
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest-mac.yml
          if-no-files-found: error

  build-macos-legacy:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Use Electron 26 for macOS 10 legacy
        run: npm install electron@26.6.10 --no-save --legacy-peer-deps --no-audit --no-fund

      - name: Validate macOS Legacy signing secrets
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" || (echo "Secret MACOS_CERT_P12_BASE64 não configurado" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Secret MACOS_CERT_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_ID" || (echo "Secret APPLE_ID não configurado" && exit 1)
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || (echo "Secret APPLE_APP_SPECIFIC_PASSWORD não configurado" && exit 1)
          test -n "$APPLE_TEAM_ID" || (echo "Secret APPLE_TEAM_ID não configurado" && exit 1)

      - name: Build macOS Legacy signed x64
        env:
          CSC_LINK: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac:legacy

      - name: Upload macOS Legacy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hook-update-center-macos-legacy-dmg
          path: |
            dist-legacy/*.dmg
            dist-legacy/*.dmg.blockmap
            dist-legacy/*.zip
            dist-legacy/*.zip.blockmap
            dist-legacy/latest-mac.yml
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-macos-legacy]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Normal e Legacy geram o mesmo nome latest-mac.yml. Publicar apenas
          # o manifesto normal evita disputa/404 por dois assets de mesmo nome.
          files: |
            artifacts/**/Hook-Center-*-Windows.exe
            artifacts/**/Hook-Center-*-Windows.exe.blockmap
            artifacts/**/latest.yml
            artifacts/**/Hook-Center-*-macOS.dmg
            artifacts/**/Hook-Center-*-macOS.dmg.blockmap
            artifacts/**/Hook-Center-*-macOS.zip
            artifacts/**/Hook-Center-*-macOS.zip.blockmap
            artifacts/hook-update-center-macos-dmg/latest-mac.yml
            artifacts/**/Hook-Center-Legacy-*-macOS10.dmg
            artifacts/**/Hook-Center-Legacy-*-macOS10.dmg.blockmap
            artifacts/**/Hook-Center-Legacy-*-macOS10.zip
            artifacts/**/Hook-Center-Legacy-*-macOS10.zip.blockmap
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
