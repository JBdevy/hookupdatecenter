name: CatLive Integration - installers
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: catlive-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  receiver:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    env:
      APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
      INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Mac universal receiver
        if: runner.os == 'macOS'
        run: cmake -S CatLiveIntegration -B integration-build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Configure Windows receiver
        if: runner.os == 'Windows'
        run: cmake -S CatLiveIntegration -B integration-build -A x64
      - name: Build
        run: cmake --build integration-build --config Release --parallel 3
      - name: Test connection, OSC, MTC and local composition creation
        run: ctest --test-dir integration-build -C Release --output-on-failure
      - name: Build standalone Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --version=6.4.3 --yes --no-progress }
          & $compiler "/DBuildDir=$((Resolve-Path integration-build).Path)" CatLiveIntegration/Installer/Windows.iss
          if ($LASTEXITCODE) { throw 'Integration installer failed.' }
      - name: Sign, package and notarize standalone Mac installer
        if: runner.os == 'macOS'
        run: bash CatLiveIntegration/Installer/package-mac.sh "$PWD/integration-build"
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Integration-1.28-${{ runner.os }}-Installer
          path: |
            integration-build/installer/*.pkg
            integration-build/installer/*.exe
          if-no-files-found: error
      - name: Package candidate
        working-directory: integration-build
        run: cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: CatLive-Integration-1.28-${{ runner.os }}
          path: integration-build/CatLive-Integration-1.28-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Integration-diagnostics-${{ runner.os }}
          path: integration-build/Testing/Temporary/
