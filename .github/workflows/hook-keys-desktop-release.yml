name: Hook Keys - Windows e macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao do Hook Keys, exemplo: 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "hook-keys-desktop-v*"

permissions:
  contents: write

concurrency:
  group: hook-keys-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.values.outputs.version }}
      tag: ${{ steps.values.outputs.tag }}
    steps:
      - id: values
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/hook-keys-desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#hook-keys-desktop-v}"
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$REQUESTED_VERSION"
            TAG="hook-keys-desktop-v$VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versao invalida.'; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hook-keys-source/Hook Keys
    steps:
      - name: Baixar codigo do Hook Keys
        uses: actions/checkout@v4
        with:
          repository: JBdevy/vshookapploja
          path: hook-keys-source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hook-keys-source/Hook Keys/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: hook-keys-source/Hook Keys/src-tauri

      - run: npm ci

      - name: Gerar instalador EXE
        run: npm run desktop:build -- --bundles nsis

      - name: Separar EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          $installer = Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Instalador EXE não encontrado.' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'build/release/Hook Keys Windows.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: Hook-Keys-Windows
          path: hook-keys-source/Hook Keys/build/release/Hook Keys Windows.exe
          if-no-files-found: error

  macos:
    needs: metadata
    runs-on: macos-14
    defaults:
      run:
        working-directory: hook-keys-source/Hook Keys
    steps:
      - name: Baixar codigo do Hook Keys
        uses: actions/checkout@v4
        with:
          repository: JBdevy/vshookapploja
          path: hook-keys-source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hook-keys-source/Hook Keys/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: hook-keys-source/Hook Keys/src-tauri

      - run: npm ci

      - name: Importar certificados Developer ID
        shell: bash
        env:
          APP_CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          INSTALLER_CERT_BASE64: ${{ secrets.MACOS_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          for value in APP_CERT_BASE64 APP_CERT_PASSWORD INSTALLER_CERT_BASE64 INSTALLER_CERT_PASSWORD; do
            test -n "${!value:-}" || { echo "Secret ausente: $value"; exit 1; }
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/hook-keys-desktop.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          APP_CERT="$RUNNER_TEMP/hook-keys-application.p12"
          INSTALLER_CERT="$RUNNER_TEMP/hook-keys-installer.p12"
          printf '%s' "$APP_CERT_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$APP_CERT"
          printf '%s' "$INSTALLER_CERT_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$INSTALLER_CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APP_CERT" -k "$KEYCHAIN_PATH" -P "$APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Inclui todas as ferramentas Apple de empacotamento, não somente
          # productbuild. A chave permanece no keychain descartável do job.
          security import "$INSTALLER_CERT" \
            -k "$KEYCHAIN_PATH" \
            -P "$INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          # Tauri não instala o keychain de certificados intermediários que
          # electron-builder instala na Hook Center. Carregue G1/G2 oficiais
          # localmente; não altera a confiança das raízes do macOS.
          for CERT_NAME in DeveloperIDCA DeveloperIDG2CA; do
            INTERMEDIATE="$RUNNER_TEMP/$CERT_NAME.cer"
            curl --fail --location --silent --show-error \
              --proto '=https' --connect-timeout 10 --max-time 30 \
              "https://www.apple.com/certificateauthority/$CERT_NAME.cer" \
              --output "$INTERMEDIATE"
            security import "$INTERMEDIATE" -k "$KEYCHAIN_PATH"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # Preserve os keychains do macOS para que a cadeia intermediária da
          # Apple continue disponível. --keychain, usado na assinatura, limita
          # a escolha da identidade ao keychain descartável deste job.
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Installer:[^"]*\)".*/\1/p' | head -n 1)"
          test -n "$APP_IDENTITY"
          test -n "$INSTALLER_IDENTITY"
          INSTALLER_LEAF="$RUNNER_TEMP/hook-keys-installer-leaf.pem"
          security find-certificate -c "$INSTALLER_IDENTITY" -p "$KEYCHAIN_PATH" > "$INSTALLER_LEAF"
          openssl x509 -in "$INSTALLER_LEAF" -noout -subject -issuer -dates -fingerprint -sha256
          security verify-cert -L -p basic -c "$INSTALLER_LEAF" -k "$KEYCHAIN_PATH"
          rm -f "$APP_CERT" "$INSTALLER_CERT"
          echo "HOOK_KEYS_APP_IDENTITY=$APP_IDENTITY" >> "$GITHUB_ENV"
          echo "HOOK_KEYS_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "HOOK_KEYS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "HOOK_KEYS_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Testar assinatura Installer antes de compilar
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          npm run test:macos-pkg-sign
          security unlock-keychain -p "$HOOK_KEYS_KEYCHAIN_PASSWORD" "$HOOK_KEYS_KEYCHAIN_PATH"
          pkgbuild --nopayload --identifier com.hookdeveloper.hookkeys.signing-probe \
            --version 1.0 "$RUNNER_TEMP/hook-keys-installer-probe-unsigned.pkg"
          node scripts/macos-pkg-sign.mjs probe \
            "$RUNNER_TEMP/hook-keys-installer-probe-unsigned.pkg" \
            "$RUNNER_TEMP/hook-keys-installer-probe-signed.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/hook-keys-installer-probe-signed.pkg" | grep -q 'Developer ID Installer'
          rm -f "$RUNNER_TEMP/hook-keys-installer-probe-unsigned.pkg" "$RUNNER_TEMP/hook-keys-installer-probe-signed.pkg"

      - name: Gerar aplicativo universal macOS
        run: npm run desktop:build -- --target universal-apple-darwin --bundles app

      - name: Assinar aplicativo Hook Keys
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          echo "Assinando $APP_PATH com $HOOK_KEYS_APP_IDENTITY"
          date -u
          codesign --force --deep --options runtime --timestamp \
            --sign "$HOOK_KEYS_APP_IDENTITY" \
            --keychain "$HOOK_KEYS_KEYCHAIN_PATH" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -E '^(Identifier|TeamIdentifier|Authority)='

      - name: Criar PKG sem assinatura
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p build/release
          pkgbuild \
            --component "$APP_PATH" \
            --install-location /Applications \
            "$RUNNER_TEMP/Hook Keys macOS unsigned.pkg"

      - name: Assinar instalador PKG
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          security unlock-keychain -p "$HOOK_KEYS_KEYCHAIN_PASSWORD" "$HOOK_KEYS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$HOOK_KEYS_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$HOOK_KEYS_KEYCHAIN_PASSWORD" \
            "$HOOK_KEYS_KEYCHAIN_PATH" > /dev/null
          echo "Assinando o PKG com $HOOK_KEYS_INSTALLER_IDENTITY"
          date -u
          # O teste da chave já ocorreu com um PKG mínimo, antes do build.
          # Este pacote final nunca é assinado sem timestamp. O watchdog
          # também encerra os helpers, evitando tentativas órfãs concorrentes.
          SIGNED_PKG='build/release/Hook Keys macOS.pkg'
          SIGNED=false
          for ATTEMPT in 1 2 3; do
            echo "Tentativa $ATTEMPT de 3 com timestamp seguro..."
            rm -f "$SIGNED_PKG"
            if node scripts/macos-pkg-sign.mjs release \
              "$RUNNER_TEMP/Hook Keys macOS unsigned.pkg" "$SIGNED_PKG"
            then
              SIGNED=true
              break
            fi
            echo "A tentativa $ATTEMPT não concluiu; o productbuild será executado novamente."
            sleep 10
          done
          test "$SIGNED" = true || { echo 'Não foi possível assinar o PKG com timestamp seguro após 3 tentativas. Confira a saída do productbuild e o diagnóstico.'; exit 1; }
          PKG_SIGNATURE="$(pkgutil --check-signature 'build/release/Hook Keys macOS.pkg')"
          printf '%s\n' "$PKG_SIGNATURE"
          grep -q 'Developer ID Installer' <<< "$PKG_SIGNATURE"
          grep -q 'Signed with a trusted timestamp' <<< "$PKG_SIGNATURE"

      - name: Guardar diagnóstico de assinatura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Signing-Diagnostics-Hook-Keys-macOS
          path: ${{ runner.temp }}/hook-keys-signing-diagnostics/
          if-no-files-found: ignore

      - name: Notarizar PKG
        timeout-minutes: 30
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          xcrun notarytool submit 'build/release/Hook Keys macOS.pkg' \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple 'build/release/Hook Keys macOS.pkg'
          xcrun stapler validate 'build/release/Hook Keys macOS.pkg'

      - uses: actions/upload-artifact@v4
        with:
          name: Hook-Keys-macOS
          path: hook-keys-source/Hook Keys/build/release/Hook Keys macOS.pkg
          if-no-files-found: error

  release:
    needs: [metadata, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Hook-Keys-*
          merge-multiple: true
          path: release-assets

      - name: Validar os dois instaladores
        shell: bash
        run: |
          set -euo pipefail
          test -s 'release-assets/Hook Keys Windows.exe'
          test -s 'release-assets/Hook Keys macOS.pkg'
          test "$(find release-assets -type f | wc -l | tr -d ' ')" = '2'

      - name: Publicar Release desktop do Hook Keys
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Hook Keys Desktop ${{ needs.metadata.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Hook Keys Windows.exe
            release-assets/Hook Keys macOS.pkg
