name: Build VS Hook Android AAB Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown on Google Play"
        required: true
        default: "1.0.0"
      version_code:
        description: "Version code. Increase on every Play Store upload"
        required: true
        default: "1"
  push:
    tags:
      - "play-v*"

permissions:
  contents: write

jobs:
  build-release-aab:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if needed
        run: |
          if [ ! -d "android" ]; then
            node ./node_modules/@capacitor/cli/bin/capacitor add android
          fi

      - name: Sync Capacitor
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Apply Android icon, permissions and network config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          XML

          if [ -d "android-icons" ]; then
            cp -R android-icons/* android/app/src/main/res/
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(r'\s*<uses-permission android:name="android.permission.INTERNET" />', '', text)
          text = re.sub(r'\s*<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />', '', text)
          m = re.search(r'<manifest\b[^>]*>', text)
          if m:
              perms = '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
              text = text[:m.end()] + perms + text[m.end():]
          app = re.search(r'<application\b[^>]*>', text)
          if app:
              tag = app.group(0)
              clean = re.sub(r'\sandroid:usesCleartextTraffic="[^"]*"', '', tag)
              clean = re.sub(r'\sandroid:networkSecurityConfig="[^"]*"', '', clean)
              clean = clean.replace('<application', '<application android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"', 1)
              text = text[:app.start()] + clean + text[app.end():]
          if 'android:icon=' in text:
              text = re.sub(r'android:icon="@mipmap/[^"]+"', 'android:icon="@mipmap/ic_launcher"', text)
          else:
              text = text.replace('<application ', '<application android:icon="@mipmap/ic_launcher" ', 1)
          if 'android:roundIcon=' in text:
              text = re.sub(r'android:roundIcon="@mipmap/[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)
          else:
              text = text.replace('<application ', '<application android:roundIcon="@mipmap/ic_launcher_round" ', 1)
          manifest.write_text(text)
          PY

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi

          printf "%s" "$KEYSTORE_BASE64" | sed '/-----BEGIN/d;/-----END/d' | tr -d '\r\n' | base64 --decode > android/app/vshook-upload-key.jks

      - name: Configure Gradle signing, SDK and version
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME_INPUT: ${{ github.event.inputs.version_name }}
          VERSION_CODE_INPUT: ${{ github.event.inputs.version_code }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing GitHub signing secrets. Required: KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os

          version_name = os.environ.get("VERSION_NAME_INPUT") or "1.0.0"
          version_code = os.environ.get("VERSION_CODE_INPUT") or "1"
          if not version_code.isdigit():
              raise SystemExit("version_code must be a number")

          # Force Capacitor Android SDK variables so Gradle never misses compileSdkVersion.
          Path("android/variables.gradle").write_text("""ext {
              minSdkVersion = 22
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          """)

          # Overwrite the app Gradle file with a clean signed release config.
          Path("android/app/build.gradle").write_text(f"""apply plugin: 'com.android.application'

          android {{
              namespace "com.hookdeveloper.vshook"
              compileSdk rootProject.ext.compileSdkVersion

              defaultConfig {{
                  applicationId "com.hookdeveloper.vshook"
                  minSdkVersion rootProject.ext.minSdkVersion
                  targetSdkVersion rootProject.ext.targetSdkVersion
                  versionCode {version_code}
                  versionName "{version_name}"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
                  aaptOptions {{
                      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
                  }}
              }}

              signingConfigs {{
                  release {{
                      storeFile file("vshook-upload-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }}
              }}

              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }}
              }}
          }}

          repositories {{
              flatDir {{
                  dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
              }}
          }}

          dependencies {{
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
              implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
              implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
              implementation project(':capacitor-android')
              testImplementation "junit:junit:$junitVersion"
              androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
              androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
              implementation project(':capacitor-cordova-android-plugins')
          }}

          apply from: 'capacitor.build.gradle'

          try {{
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {{
                  apply plugin: 'com.google.gms.google-services'
              }}
          }} catch(Exception e) {{
              logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
          }}
          """)
          PY

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Rename AAB
        run: |
          mkdir -p release
          cp android/app/build/outputs/bundle/release/app-release.aab release/VS-Hook-Android-release.aab

      - name: Upload AAB to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: VS-Hook-Android-release-aab
          path: release/VS-Hook-Android-release.aab

      - name: Publish AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/play-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/VS-Hook-Android-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
